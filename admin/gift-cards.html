<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROYRA JEWELS ADMIN | Gift Cards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="admin.css" />
  <script src="lucide.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="admin-body">
  <div class="admin-layout">
    
    <div id="admin-sidebar-overlay" class="admin-sidebar-overlay" onclick="toggleAdminSidebar()"></div>
    <aside id="admin-sidebar" class="admin-sidebar">
      <!-- Replaced by script -->
    </aside>

    <main class="admin-main">
      <header class="admin-topbar">
        <div class="topbar-left">
          <button type="button" class="mobile-menu-toggle" onclick="toggleAdminSidebar()">
            <i data-lucide="menu"></i>
          </button>
          <a href="index.html" class="topbar-brand">
            <span class="brand-logo">RJ</span>
            <span class="brand-text">ROYRA JEWELS</span>
          </a>
        </div>
        <div class="topbar-center">
          <div class="global-search">
            <i data-lucide="search" class="search-icon"></i>
            <input type="text" placeholder="Search" />
            <span class="search-shortcut">CTRL K</span>
          </div>
        </div>
        <div class="topbar-right">
          <button type="button" class="icon-btn"><i data-lucide="bell"></i></button>
          <div class="profile-dropdown">
            <div class="avatar">MS</div>
            <span class="profile-name">Royra Jewels Admin</span>
            <i data-lucide="chevron-down" style="width:14px;height:14px;"></i>
          </div>
        </div>
      </header>

      <div class="admin-content" style="max-width: 1000px; margin: 0 auto; padding-top: 24px;">
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <h1 style="font-size: 20px; font-weight: 600; color: #202223;">Gift cards</h1>
          <div style="display: flex; gap: 8px;">
            <button class="btn-admin-secondary" style="padding: 6px 12px; font-size: 13px;">Export</button>
            <button class="btn-admin-primary" onclick="window.location.href='create-gift-card.html'" style="padding: 6px 12px; font-size: 13px;">Issue gift card</button>
          </div>
        </div>

        <div class="admin-card" style="padding: 64px 20px; text-align: center;">
          <div style="width: 120px; height: 120px; margin: 0 auto 24px auto;">
            <!-- Placeholder for illustration -->
            <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="20" y="30" width="80" height="50" rx="4" fill="#E4E5E7"/>
              <path d="M20 45H100" stroke="#FFFFFF" stroke-width="2"/>
              <circle cx="60" cy="55" r="8" fill="#FFFFFF"/>
              <rect x="30" y="65" width="20" height="4" rx="2" fill="#FFFFFF"/>
            </svg>
          </div>
          <h2 style="font-size: 16px; font-weight: 600; color: #202223; margin-bottom: 8px;">Start selling gift cards</h2>
          <p style="font-size: 14px; color: #6D7175; max-width: 400px; margin: 0 auto 24px auto;">
            Add a gift card product to your store for customers to purchase. You can also issue gift cards directly to customers.
          </p>
          <div style="display: flex; justify-content: center; gap: 12px;">
            <button class="btn-admin-secondary" onclick="window.location.href='create-gift-card.html'">Issue gift card</button>
            <button class="btn-admin-primary">Add gift card product</button>
          </div>
        </div>
        
        <div style="text-align: center; margin-top: 24px;">
          <a href="#" style="color: #6D7175; font-size: 13px; text-decoration: underline;">Learn more about gift cards</a>
        </div>

      </div>
    </main>
  </div>
  <script src="../config.js"></script>
  <script src="../supabase.js"></script>
  <script src="admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });
  </script>
</body>
</html>
