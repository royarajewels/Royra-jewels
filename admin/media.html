ar" class="admin-sidebar"><div class="sidebar-header"><a href="index.html" class="sidebar-logo"><span class="sidebar-logo-text">ROYRA</span><span class="sidebar-badge">ADMIN</span></a></div><nav class="sidebar-nav"><div class="nav-section-title">Store Management</div><a href="index.html" class="nav-link">Dashboard</a><a href="products.html" class="nav-link">Products</a><a href="categories.html" class="nav-link">Categories</a><a href="collections.html" class="nav-link">Collections</a><a href="product-form.html" class="nav-link">Add Product</a><div class="nav-section-title" style="margin-top:18px">Content</div><a href="media.html" class="nav-link active">Media Library</a><a href="banners.html" class="nav-link">Banners</a><div class="nav-section-title" style="margin-top:18px">System</div><a href="settings.html" class="nav-link">Settings</a></nav><div class="sidebar-footer"><a href="../index.html" target="_blank" class="sidebar-view-store">View Public Store</a><div class="sidebar-user"><div class="sidebar-user-avatar">AD</div><div class="sidebar-user-info"><div class="sidebar-user-name">Royra Administrator</div><div class="sidebar-user-role" id="admin-user-display-email">Admin Session</div></div></div><button type="button" class="sidebar-logout-btn" onclick="handleAdminLogout()">Logout</button></div></aside><main class="admin-main"><header class="admin-topbar"><div class="topbar-left"><button type="button" class="mobile-menu-toggle" onclick="toggleAdminSidebar()">☰</button><h1 class="topbar-title">Media Library</h1></div><div class="topbar-right"><label class="btn-admin-primary" for="media-upload">+ UPLOAD MEDIA</label><input id="media-upload" class="cms-upload-input" type="file" accept="image/*" multiple></div></header><div class="admin-content"><div class="admin-card"><div class="admin-card-header"><div class="cms-toolbar" style="width:100%"><div class="search-box" style="max-width:460px"><input id="media-search" class="search-input" placeholder="Search image name..."
