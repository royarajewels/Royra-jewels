<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FCFAF7" />
      <stop offset="70%" stop-color="#F2EDE2" />
      <stop offset="100%" stop-color="#E2D8BE" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF1D6" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bgGrad)" />
  <circle cx="400" cy="400" r="320" fill="none" stroke="#EFE9DC" stroke-width="1.5" />
  <!-- Tennis Bracelet Curved Path -->
  <g transform="translate(400, 410)">
    <ellipse cx="0" cy="0" rx="260" ry="160" fill="none" stroke="url(#gold)" stroke-width="8" />
    <!-- Individual Brilliant Diamonds in Settings around the ellipse -->
    <!-- Front loop -->
    <path d="M-260,0 C-260,90 -140,160 0,160 C140,160 260,90 260,0 C260,-90 140,-160 0,-160 C-140,-160 -260,-90 -260,0" fill="none" id="braceletPath" />
    <!-- Repeating Diamond Links -->
    <g fill="#EAF5FB" stroke="#B08D57" stroke-width="2">
      <!-- Top arc -->
      <circle cx="-200" cy="-100" r="14" fill="#FFFFFF" />
      <circle cx="-130" cy="-140" r="14" fill="#FFFFFF" />
      <circle cx="-50" cy="-158" r="14" fill="#FFFFFF" />
      <circle cx="30" cy="-160" r="14" fill="#FFFFFF" />
      <circle cx="110" cy="-145" r="14" fill="#FFFFFF" />
      <circle cx="190" cy="-110" r="14" fill="#FFFFFF" />
      <circle cx="250" cy="-45" r="14" fill="#FFFFFF" />
      <!-- Bottom arc (foreground, larger) -->
      <circle cx="255" cy="30" r="17" fill="#FFFFFF" stroke-width="3" />
      <circle cx="210" cy="95" r="17" fill="#FFFFFF" stroke-width="3" />
      <circle cx="140" cy="140" r="17" fill="#FFFFFF" stroke-width="3" />
      <circle cx="60" cy="160" r="17" fill="#FFFFFF" stroke-width="3" />
      <circle cx="-30" cy="160" r="17" fill="#FFFFFF" stroke-width="3" />
      <circle cx="-120" cy="142" r="17" fill="#FFFFFF" stroke-width="3" />
      <circle cx="-195" cy="100" r="17" fill="#FFFFFF" stroke-width="3" />
      <circle cx="-250" cy="35" r="17" fill="#FFFFFF" stroke-width="3" />
    </g>
    <!-- Sparkle facets inside diamonds -->
    <g fill="#38BDF8" opacity="0.35">
      <circle cx="140" cy="140" r="9" />
      <circle cx="60" cy="160" r="9" />
      <circle cx="-30" cy="160" r="9" />
      <circle cx="-120" cy="142" r="9" />
    </g>
    <!-- Clasp -->
    <rect x="-268" y="-12" width="18" height="24" rx="4" fill="url(#gold)" stroke="#8A6014" stroke-width="2" />
  </g>
  <text x="400" y="740" text-anchor="middle" font-family="'Playfair Display', serif" font-size="14" letter-spacing="6" fill="#B08D57" opacity="0.85">ROYRA JEWELS • CLASSIC TENNIS BRACELET</text>
</svg>
