<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROYRA JEWELS ADMIN | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Admin Stylesheet -->
  <link rel="stylesheet" href="admin.css" />
  <link rel="stylesheet" href="ops.css" />
  <!-- Lucide Icons -->
  <script src="lucide.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="admin-login-body">

  <div class="admin-login-card">
    <div class="login-brand">
      <div class="login-logo">ROYRA</div>
      <div class="login-badge">JEWELS ADMIN PANEL</div>
    </div>

    <!-- SUPABASE CONNECTION STATUS BANNER -->
    <div id="supabase-config-status" class="supabase-status-pill" style="margin-bottom: 16px; width: 100%; justify-content: center;">
      <span id="supabase-status-dot" class="status-dot online"></span>
      <span id="supabase-status-text">Supabase Authentication Active</span>
    </div>

    <!-- ERROR & NOTIFICATION ALERT -->
    <div id="login-error-alert" class="login-error-alert" style="display: none;"></div>

    <!-- ADMIN LOGIN FORM (SUPABASE AUTH) -->
    <form id="admin-login-form">
      <div class="form-group">
        <label for="admin-email" class="form-label">Admin Email Address <span class="required">*</span></label>
        <input type="email" id="admin-email" class="form-input" placeholder="admin@royrajewels.com" required autocomplete="email" />
      </div>

      <div class="form-group" style="margin-bottom: 24px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
          <label for="admin-password" class="form-label" style="margin-bottom: 0;">Admin Password <span class="required">*</span></label>
          <button type="button" onclick="showForgotPasswordForm()" style="background: none; border: none; color: var(--admin-accent); font-size: 12px; cursor: pointer; text-decoration: underline; font-weight: 500;">
            Forgot Password?
          </button>
        </div>
        <input type="password" id="admin-password" class="form-input" placeholder="••••••••••••" required autocomplete="current-password" />
      </div>

      <button type="submit" id="admin-login-submit" class="btn-admin-primary" style="width: 100%; padding: 13px; font-size: 14px;">
        SIGN IN WITH SUPABASE AUTH →
      </button>

      <div style="margin-top: 20px; display: flex; justify-content: space-between; align-items: center;">
        <a href="../index.html" style="color: var(--admin-text-secondary); text-decoration: none; font-size: 12.5px;">
          ← Return to Store
        </a>
        <button type="button" onclick="toggleSupabaseSettings()" style="background: none; border: none; color: var(--admin-accent); font-size: 12.5px; cursor: pointer; text-decoration: underline;">
          ⚙ Supabase Settings
        </button>
      </div>
    </form>

    <!-- ADMIN FORGOT PASSWORD FORM (RECOVERY FLOW) -->
    <form id="admin-forgot-form" style="display: none;">
      <div style="font-weight: 600; font-size: 14px; color: var(--admin-text); margin-bottom: 6px;">
        Reset Admin Password
      </div>
      <p style="font-size: 12.5px; color: var(--admin-text-secondary); margin-bottom: 18px; line-height: 1.5;">
        Enter your admin email address and we'll send you a secure link to reset your password.
      </p>

      <div class="form-group" style="margin-bottom: 24px;">
        <label for="forgot-email" class="form-label">Admin Email Address <span class="required">*</span></label>
        <input type="email" id="forgot-email" class="form-input" placeholder="admin@royrajewels.com" required autocomplete="email" />
      </div>

      <button type="submit" id="admin-forgot-submit" class="btn-admin-primary" style="width: 100%; padding: 13px; font-size: 14px; margin-bottom: 16px;">
        SEND RESET LINK →
      </button>

      <div style="text-align: center;">
        <button type="button" onclick="showLoginForm()" style="background: none; border: none; color: var(--admin-text-secondary); font-size: 12.5px; cursor: pointer; text-decoration: none;">
          ← Back to Login
        </button>
      </div>
    </form>

    <!-- SUPABASE CREDENTIALS MODAL / EXPANDABLE DRAWER -->
    <div id="supabase-settings-drawer" style="display: none; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--admin-border);">
      <div style="font-weight: 600; font-size: 13px; color: var(--admin-text); margin-bottom: 8px;">
        Supabase Project Configuration
      </div>
      <p style="font-size: 11.5px; color: var(--admin-text-secondary); margin-bottom: 12px;">
        Connect your Supabase project using your Project URL and public Anon Key.
      </p>

      <div class="form-group" style="margin-bottom: 10px;">
        <label for="cfg-supabase-url" class="form-label" style="font-size: 11.5px;">SUPABASE_URL</label>
        <input type="url" id="cfg-supabase-url" class="form-input" style="font-size: 12px;" placeholder="https://your-project.supabase.co" />
      </div>

      <div class="form-group" style="margin-bottom: 14px;">
        <label for="cfg-supabase-key" class="form-label" style="font-size: 11.5px;">SUPABASE_ANON_KEY (Public Key)</label>
        <input type="password" id="cfg-supabase-key" class="form-input" style="font-size: 12px;" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..." />
      </div>

      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <button type="button" class="btn-admin-primary" style="flex: 1; padding: 8px 12px; font-size: 12px;" onclick="saveSupabaseCredentials()">
          Save & Connect
        </button>
        <button type="button" class="btn-admin-secondary" style="padding: 8px 12px; font-size: 12px;" onclick="resetSupabaseCredentials()">
          Reset to config.js
        </button>
        <button type="button" class="btn-admin-secondary" style="padding: 8px 12px; font-size: 12px;" onclick="toggleSupabaseSettings()">
          Close
        </button>
      </div>
    </div>
  </div>

  <div id="admin-toast-container" class="admin-toast-container"></div>

  <!-- Correct script loading order for GitHub Pages -->
  <script src="../config.js"></script>
  <script src="../supabase.js"></script>
  <script src="admin.js"></script>
  <script src="ops.js"></script>
  <script>
    // Check if user is already signed in via Supabase Auth
    document.addEventListener('DOMContentLoaded', async () => {
      if (window.RoyraDB) {
        updateConfigUI();

        // Handle URL parameters (e.g. ?reason=forbidden)
        const urlParams = new URLSearchParams(window.location.search);
        const reason = urlParams.get('reason');
        const errorEl = document.getElementById('login-error-alert');

        if (reason === 'forbidden') {
          errorEl.textContent = 'You do not have administrator access.';
          errorEl.style.display = 'block';
        } else if (reason === 'unauthorized') {
          errorEl.textContent = 'Please log in with your administrator credentials to access the Royra Admin Panel.';
          errorEl.style.display = 'block';
        } else if (reason === 'unconfigured') {
          errorEl.textContent = 'Please configure your Supabase Project URL and Public Anon Key in /config.js.';
          errorEl.style.display = 'block';
          toggleSupabaseSettings();
        }

        try {
          const session = await window.RoyraDB.getSession();
          if (session && session.user && !reason) {
            const profile = await window.RoyraDB.getUserProfile(session.user.id);
            if (profile && profile.role === 'admin') {
              window.location.href = 'index.html';
            }
          }
        } catch (e) {}
      } else {
        const errorEl = document.getElementById('login-error-alert');
        if (errorEl) {
          errorEl.textContent = 'Supabase client could not be loaded. Please ensure ../supabase.js is present.';
          errorEl.style.display = 'block';
        }
      }
    });

    function updateConfigUI() {
      if (!window.RoyraDB) return;
      const config = window.RoyraDB.getConfig();
      const statusDot = document.getElementById('supabase-status-dot');
      const statusText = document.getElementById('supabase-status-text');
      const urlInput = document.getElementById('cfg-supabase-url');
      const keyInput = document.getElementById('cfg-supabase-key');

      if (urlInput) urlInput.value = config.url || '';
      if (keyInput) keyInput.value = config.anonKey || '';

      if (window.RoyraDB.isConfigured()) {
        if (statusDot) statusDot.className = 'status-dot online';
        if (statusText) statusText.textContent = 'Supabase Connected';
      } else {
        if (statusDot) statusDot.className = 'status-dot offline';
        if (statusText) statusText.textContent = 'Supabase Configuration Needed';
      }
    }

    function toggleSupabaseSettings() {
      const drawer = document.getElementById('supabase-settings-drawer');
      if (drawer) {
        drawer.style.display = drawer.style.display === 'none' ? 'block' : 'none';
      }
    }

    function saveSupabaseCredentials() {
      const url = document.getElementById('cfg-supabase-url').value.trim();
      const key = document.getElementById('cfg-supabase-key').value.trim();
      const errorEl = document.getElementById('login-error-alert');

      if (!url || !key) {
        if (errorEl) {
          errorEl.textContent = 'Please enter both Supabase URL and Anon Key.';
          errorEl.style.display = 'block';
        }
        return;
      }

      if (window.RoyraDB) {
        window.RoyraDB.setCredentials(url, key);
        updateConfigUI();
        toggleSupabaseSettings();
        if (errorEl) errorEl.style.display = 'none';
        if (window.showAdminToast) {
          window.showAdminToast('Supabase credentials saved locally.', 'success');
        } else {
          alert('Supabase credentials saved locally. You can now log in with your Supabase Auth user.');
        }
      }
    }

    function resetSupabaseCredentials() {
      if (window.RoyraDB) {
        window.RoyraDB.clearCredentials();
        updateConfigUI();
        if (window.showAdminToast) {
          window.showAdminToast('Reset to config.js defaults.', 'success');
        } else {
          alert('Reset to config.js defaults.');
        }
      }
    }

    function showForgotPasswordForm() {
      const loginForm = document.getElementById('admin-login-form');
      const forgotForm = document.getElementById('admin-forgot-form');
      const errorEl = document.getElementById('login-error-alert');
      const adminEmail = document.getElementById('admin-email').value;
      const forgotEmail = document.getElementById('forgot-email');

      if (adminEmail && forgotEmail) {
        forgotEmail.value = adminEmail;
      }

      if (loginForm) loginForm.style.display = 'none';
      if (forgotForm) forgotForm.style.display = 'block';
      if (errorEl) errorEl.style.display = 'none';
    }

    function showLoginForm() {
      const loginForm = document.getElementById('admin-login-form');
      const forgotForm = document.getElementById('admin-forgot-form');
      const errorEl = document.getElementById('login-error-alert');

      if (forgotForm) forgotForm.style.display = 'none';
      if (loginForm) loginForm.style.display = 'block';
      if (errorEl) errorEl.style.display = 'none';
    }

    // Forgot Password Form Handler
    document.getElementById('admin-forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('forgot-email').value.trim();
      const errorEl = document.getElementById('login-error-alert');
      const submitBtn = document.getElementById('admin-forgot-submit');

      if (!window.RoyraDB || !window.RoyraDB.isConfigured()) {
        errorEl.textContent = 'Supabase is not configured. Please enter your Supabase Project URL and Anon Key.';
        errorEl.style.display = 'block';
        toggleSupabaseSettings();
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending Reset Link...';
      errorEl.style.display = 'none';

      try {
        const res = await window.RoyraDB.requestPasswordReset(email);
        if (res && res.success) {
          if (window.showAdminToast) {
            window.showAdminToast('Password reset email sent. Check your inbox.', 'success');
          }
          errorEl.className = 'login-error-alert';
          errorEl.style.backgroundColor = 'var(--admin-success-bg)';
          errorEl.style.borderColor = 'rgba(16, 185, 129, 0.3)';
          errorEl.style.color = 'var(--admin-success)';
          errorEl.innerHTML = `<strong>Password reset email sent.</strong><br/>Please check <em>${email}</em> for your secure recovery link to update your password.`;
          errorEl.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'SEND RESET LINK →';
        } else {
          errorEl.className = 'login-error-alert';
          errorEl.style.backgroundColor = 'var(--admin-danger-bg)';
          errorEl.style.borderColor = 'rgba(239, 68, 68, 0.3)';
          errorEl.style.color = 'var(--admin-danger)';
          errorEl.textContent = (res && res.error) ? res.error : 'Failed to send password reset email.';
          errorEl.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'SEND RESET LINK →';
        }
      } catch (err) {
        errorEl.className = 'login-error-alert';
        errorEl.style.backgroundColor = 'var(--admin-danger-bg)';
        errorEl.style.borderColor = 'rgba(239, 68, 68, 0.3)';
        errorEl.style.color = 'var(--admin-danger)';
        errorEl.textContent = (err && err.message) ? err.message : 'Error sending password reset email.';
        errorEl.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'SEND RESET LINK →';
      }
    });

    // Login Form Handler (Pure Supabase Auth)
    document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('admin-email').value.trim();
      const password = document.getElementById('admin-password').value;
      const errorEl = document.getElementById('login-error-alert');
      const submitBtn = document.getElementById('admin-login-submit');

      if (!window.RoyraDB) {
        errorEl.textContent = 'Supabase client is not loaded.';
        errorEl.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';
      errorEl.style.display = 'none';

      try {
        const res = await window.RoyraDB.login(email, password);
        if (res && res.success) {
          window.location.href = 'index.html';
        } else {
          const errorMsg = (res && res.error) ? res.error : 'Invalid credentials or user not authorized.';
          errorEl.textContent = errorMsg;
          errorEl.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'SIGN IN WITH SUPABASE AUTH →';

          if (res && res.needsConfig) {
            toggleSupabaseSettings();
          }
        }
      } catch (err) {
        errorEl.textContent = (err && err.message) ? err.message : 'Authentication error connecting to Supabase.';
        errorEl.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'SIGN IN WITH SUPABASE AUTH →';
      }
    });
  </script>
</body>
</html>
