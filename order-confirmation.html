<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order Confirmed | ROYRA JEWELS</title><link rel="stylesheet" href="style.css"></head><body><div class="announcement-bar">ROYRA JEWELS • ORDER CONFIRMATION</div><div class="container" style="max-width:760px;padding:90px 20px;text-align:center"><div style="font-size:54px">✓</div><span class="section-tag">ORDER CONFIRMED</span><h1 style="font-size:42px;margin:10px 0 14px">Thank you for choosing ROYRA.</h1><p style="color:#666">Your order has been recorded. The Admin Panel now has the order for processing.</p><div id="order-summary" style="margin:30px 0;padding:22px;background:#faf7f2;border:1px solid #e7e3dd;border-radius:10px;text-align:left"></div><a href="shop.html" class="btn btn-primary">Continue Shopping</a></div><script>const raw=localStorage.getItem('royra_last_order');const el=document.getElementById('order-summary');if(raw){const o=JSON.parse(raw);el.innerHTML=`<strong>Order Number:</strong> ${o.order_number}<br><strong>Customer:</strong> ${o.name}<br><strong>Total:</strong> ₹${Number(o.total||0).toLocaleString('en-IN')}<br><strong>Payment:</strong> ${o.payment_status}`;}</script></body></html>
