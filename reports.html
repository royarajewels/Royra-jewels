<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ROYRA JEWELS ADMIN</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="ops.css"></head><body class="admin-body"><div class="admin-layout"><aside class="admin-sidebar"><div class="sidebar-header"><a href="index.html" class="sidebar-logo"><span class="sidebar-logo-text">ROYRA</span><span class="sidebar-badge">ADMIN</span></a></div><nav class="sidebar-nav"><div class="nav-section-title">Store Management</div><a href="index.html" class="nav-link">Dashboard</a><a href="products.html" class="nav-link">Products</a><a href="categories.html" class="nav-link">Categories</a><a href="collections.html" class="nav-link">Collections</a><a href="product-form.html" class="nav-link">Add Product</a><div class="nav-section-title" style="margin-top:18px">Content</div><a href="media.html" class="nav-link">Media Library</a><a href="banners.html" class="nav-link">Banners</a><div class="nav-section-title" style="margin-top:18px">Sales</div><a href="orders.html" class="nav-link">Orders</a><a href="customers.html" class="nav-link">Customers</a><a href="coupons.html" class="nav-link">Coupons</a><a href="offers.html" class="nav-link">Offers</a><div class="nav-section-title" style="margin-top:18px">Inventory</div><a href="inventory.html" class="nav-link">Inventory</a><a href="purchase-orders.html" class="nav-link">Purchase Orders</a><a href="suppliers.html" class="nav-link">Suppliers</a><div class="nav-section-title" style="margin-top:18px">Finance & Operations</div><a href="payments.html" class="nav-link">Payments</a><a href="refunds.html" class="nav-link">Refunds</a><a href="returns.html" class="nav-link">Returns</a><a href="shipping.html" class="nav-link">Shipping</a><a href="reports.html" class="nav-link">Reports</a><div class="nav-section-title" style="margin-top:18px">System</div><a href="users.html" class="nav-link">Admin Users</a><a href="settings.html" class="nav-link">Settings</a></nav><div class="sidebar-footer"><a href="../index.html" target="_blank" class="sidebar-view-store">View Public Store</a><button type="button" class="sidebar-logout-btn" onclick="handleAdminLogout()">Logout</button></div></aside><main class="admin-main"><header class="admin-topbar"><h1 class="topbar-title">Reports</h1></header><div class="admin-content ops-page"><div class="ops-card-grid" id="report-kpis"></div><div class="admin-card" style="padding:20px"><button class="btn-admin-secondary" onclick="exportOrdersCSV()">Export Orders CSV</button></div><script>document.addEventListener('DOMContentLoaded',async()=>{const orders=await RoyraDB.getOrders();const paid=orders.filter(o=>o.payment_status==='Paid');const sales=paid.reduce((s,o)=>s+Number(o.total_amount||0),0);document.getElementById('report-kpis').innerHTML=[['Orders',orders.length],['Paid Orders',paid.length],['Sales',formatINR(sales)],['Pending Payment',orders.filter(o=>o.payment_status==='Pending').length]].map(x=>`<div class="ops-kpi"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');window.exportOrdersCSV=()=>{const rows=[['Order','Customer','Email','Total','Payment','Status','Date'],...orders.map(o=>[o.order_number,o.customer_name,o.customer_email,o.total_amount,o.payment_status,o.order_status,o.created_at])];const csv=rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='royra-orders.csv';a.click();URL.revokeObjectURL(a.href);}});</script></div></main></div><script src="../config.js"></script><script src="../supabase.js"></script><script src="admin.js"></script><script src="ops.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{});</script></body></html>
