<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ROYRA JEWELS ADMIN | Collections</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="admin.css"><style>.cms-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.cms-span-2{grid-column:span 2}.cms-product-picker{max-height:330px;overflow:auto;border:1px solid var(--admin-border);border-radius:10px;padding:10px}.cms-check-row{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:9px;border-bottom:1px solid #eee;font-size:13px}.cms-check-row:last-child{border-bottom:0}.cms-check-row small{color:#888}.cms-table-img{width:56px;height:50px;object-fit:cover;border-radius:8px;background:#f7f5f1}.btn-action.danger{color:#b42318}@media(max-width:900px){.cms-form-grid{grid-template-columns:1fr}.cms-span-2{grid-column:span 1}}</style></head><body class="admin-body"><div class="admin-layout"><div id="admin-sidebar-overlay" class="admin-sidebar-overlay" onclick="toggleAdminSidebar()"></div><aside id="admin-sidebar" class="admin-sidebar"><div class="sidebar-header"><a href="index.html" class="sidebar-logo"><span class="sidebar-logo-text">ROYRA</span><span class="sidebar-badge">ADMIN</span></a></div><nav class="sidebar-nav"><div class="nav-section-title">Store Management</div><a href="index.html" class="nav-link">Dashboard</a><a href="products.html" class="nav-link">Products</a><a href="categories.html" class="nav-link">Categories</a><a href="collections.html" class="nav-link active">Collections</a><a href="product-form.html" class="nav-link">Add Product</a><div class="nav-section-title" style="margin-top:18px">Content</div><a href="media.html" class="nav-link">Media Library</a><a href="banners.html" class="nav-link">Banners</a><div class="nav-section-title" style="margin-top:18px">System</div><a href="settings.html" class="nav-link">Settings</a></nav><div class="sidebar-footer"><a href="../index.html" target="_blank" class="sidebar-view-store">View Public Store</a><div class="sidebar-user"><div class="sidebar-user-avatar">AD</div><div class="sidebar-user-info"><div class="sidebar-user-name">Royra Administrator</div><div class="sidebar-user-role" id="admin-user-display-email">Admin Session</div></div></div><button type="button" class="sidebar-logout-btn" onclick="handleAdminLogout()">Logout</button></div></aside><main class="admin-main"><header class="admin-topbar"><div class="topbar-left"><button class="mobile-menu-toggle" onclick="toggleAdminSidebar()">☰</button><h1 class="topbar-title">Collection Management</h1></div><div class="topbar-right"><button class="btn-admin-secondary" id="collection-clear">+ New Collection</button></div></header><div class="admin-content"><div class="admin-card"><div class="admin-card-header"><h2 class="admin-card-title">Collection Editor</h2></div><form id="collection-form"><div class="modal-body"><input type="hidden" id="collection-id"><div class="cms-form-grid"><div class="form-group"><label class="form-label">Collection Name *</label><input id="collection-name" class="form-input" required placeholder="ROYRA Signature"></div><div class="form-group"><label class="form-label">Slug *</label><input id="collection-slug" class="form-input" required placeholder="royra-signature"></div><div class="form-group cms-span-2"><label class="form-label">Short Description</label><input id="collection-short-description" class="form-input"></div><div class="form-group cms-span-2"><label class="form-label">Description</label><textarea id="collection-description" class="form-textarea" rows="3"></textarea></div><div class="form-group"><label class="form-label">Collection Image URL</label><input id="collection-image-url" class="form-input" placeholder="https://..."><input id="collection-upload-image" type="file" accept="image/*" style="margin-top:8px"></div><div class="form-group"><label class="form-label">Banner Image URL</label><input id="collection-banner-url" class="form-input" placeholder="https://..."><input id="collection-upload-banner" type="file" accept="image/*" style="margin-top:8px"></div><div class="form-group"><label class="form-label">Status</label><select id="collection-status" class="form-select"><option>Active</option><option>Draft</option><option>Archived</option></select></div><div class="form-group"><label class="form-label">Display Order</label><input id="collection-order" class="form-input" type="number" value="1" min="1"></div><div class="form-group"><label class="form-label"><input id="collection-featured" type="checkbox"> Featured collection</label></div><div class="form-group cms-span-2"><label class="form-label">Products in Collection</label><div id="collection-products" class="cms-product-picker">Loading products…</div></div></div></div><div class="modal-footer"><button type="submit" class="btn-admin-primary">Save Collection</button></div></form></div><div class="admin-card" style="margin-top:20px"><div class="admin-card-header"><h2 class="admin-card-title">Collections</h2></div><div class="table-responsive"><table class="admin-table"><thead><tr><th>Image</th><th>Collection</th><th>Status</th><th>Featured</th><th>Products</th><th>Actions</th></tr></thead><tbody id="collections-tbody"></tbody></table></div></div></div></main></div><script src="../config.js"></script><script src="../supabase.js"></script><script src="admin.js"></script>
