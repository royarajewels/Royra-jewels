<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ROYRA JEWELS | Collection</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><style>.cms-public-hero{min-height:420px;background:#f7f5f1;position:relative;display:flex;align-items:flex-end;overflow:hidden}.cms-public-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.cms-public-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.02),rgba(0,0,0,.55))}.cms-public-copy{position:relative;z-index:2;color:#fff;padding:70px 0 55px}.cms-public-copy h1{font-family:Georgia,serif;font-size:54px;margin:10px 0}.cms-public-copy p{max-width:700px;font-size:16px}.cms-public-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;padding:60px 0}.cms-public-card img{width:100%;aspect-ratio:1/1;object-fit:contain;background:#f8f7f5;display:block}.cms-public-card .cat{font-size:11px;letter-spacing:.1em;color:#9b7d49;margin-top:10px;text-transform:uppercase}.cms-public-card h3{font-family:Georgia,serif;font-size:18px;font-weight:500;margin:7px 0}.cms-public-card .price{font-size:16px}@media(max-width:900px){.cms-public-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.cms-public-copy h1{font-size:40px}}@media(max-width:600px){.cms-public-hero{min-height:360px}.cms-public-copy{padding:45px 18px 35px}.cms-public-copy h1{font-size:34px}.cms-public-grid{padding:40px 12px}}
</style></head><body><div id="page-root"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase.js"></script><script>
(async()=>{const root=document.getElementById('page-root');const slug=new URLSearchParams(location.search).get('slug');if(!window.RoyraDB||!slug){root.innerHTML='<div style="padding:120px;text-align:center">Collection unavailable.</div>';return;}const c=await RoyraDB.getCollectionBySlug(slug);if(!c){root.innerHTML='<div style="padding:120px;text-align:center">Collection not found.</div>';return;}const products=await RoyraDB.getCollectionProducts(c.id);root.innerHTML=`<header style="border-bottom:1px solid #eee;padding:20px 4%;display:flex;justify-content:space-between;align-items:center"><a href="index.html" style="text-decoration:none;color:#111;font-family:Georgia,serif;font-size:24px;letter-spacing:.18em">ROYRA</a><a href="shop.html" style="color:#111;text-decoration:none">SHOP ALL →</a></header><section class="cms-public-hero"><img src="${c.banner_image_url||c.collection_image_url||'assets/products/product-01.jpg'}" alt="${c.name}"><div class="container cms-public-copy"><span style="letter-spacing:.18em;text-transform:uppercase;font-size:12px">ROYRA COLLECTION</span><h1>${c.name}</h1><p>${c.description||c.short_description||''}</p></div></section><main><div class="container"><div class="cms-public-grid">${products.map(p=>`<a class="cms-public-card" href="product.html?id=${encodeURIComponent(p.id)}" style="text-decoration:none;color:inherit"><img src="${p.image||'assets/products/product-01.jpg'}" alt="${p.name}"><div class="cat">${p.category||'Jewellery'}</div><h3>${p.name}</h3><div class="price">₹${Number(p.price||0).toLocaleString('en-IN')}</div></a>`).join('')}</div></div></main>`;})();
</script></body></html>
