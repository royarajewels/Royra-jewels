<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FCFAF7" />
      <stop offset="70%" stop-color="#F3ECE2" />
      <stop offset="100%" stop-color="#E2D8BF" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF1D6" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="80%" stop-color="#996515" />
      <stop offset="100%" stop-color="#E5C158" />
    </linearGradient>
    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bgGrad)" />
  <circle cx="400" cy="400" r="320" fill="none" stroke="#EFE9DC" stroke-width="1.5" />
  <!-- Elegant Draped Necklace Chain -->
  <path d="M180,120 C220,380 280,480 400,490 C520,480 580,380 620,120" fill="none" stroke="url(#gold)" stroke-width="5" stroke-dasharray="8,4" />
  <!-- Pendant Bail -->
  <g transform="translate(400, 490)">
    <rect x="-6" y="0" width="12" height="22" rx="3" fill="url(#gold)" />
    <!-- Pendant Frame -->
    <circle cx="0" cy="55" r="38" fill="url(#gold)" stroke="#8A6014" stroke-width="2" />
    <!-- Center Solitaire Gem -->
    <polygon points="0,25 26,40 30,70 0,85 -30,70 -26,40" fill="url(#diamondGrad)" stroke="#FFFFFF" stroke-width="2" />
    <polygon points="0,25 0,85 26,40" fill="#FFFFFF" opacity="0.4" />
    <polygon points="0,42 16,55 0,68 -16,55" fill="#FFFFFF" opacity="0.8" />
    <!-- Light Sparkle -->
    <polygon points="0,15 2,21 8,23 2,25 0,31 -2,25 -8,23 -2,21" fill="#FFFFFF" />
  </g>
  <text x="400" y="740" text-anchor="middle" font-family="'Playfair Display', serif" font-size="14" letter-spacing="6" fill="#B08D57" opacity="0.85">ROYRA JEWELS • MINIMAL GOLD PENDANT</text>
</svg>
