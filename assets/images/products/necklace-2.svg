  </defs>
  <rect width="800" height="800" fill="url(#bgGrad)" />
  <circle cx="400" cy="400" r="320" fill="none" stroke="#EFE9DC" stroke-width="1.5" />
  <!-- Layer 1: Choker Chain -->
  <path d="M220,160 C260,300 320,360 400,365 C480,360 540,300 580,160" fill="none" stroke="url(#gold)" stroke-width="4" />
  <circle cx="400" cy="365" r="10" fill="#FFFFFF" stroke="url(#gold)" stroke-width="2" />
  <!-- Layer 2: Mid Length Bar Chain -->
  <path d="M190,140 C230,380 300,460 400,470 C500,460 570,380 610,140" fill="none" stroke="url(#gold)" stroke-width="4" stroke-dasharray="6,3" />
  <rect x="360" y="465" width="80" height="12" rx="4" fill="url(#gold)" />
  <circle cx="375" cy="471" r="3" fill="#FFFFFF" />
  <circle cx="400" cy="471" r="3" fill="#FFFFFF" />
  <circle cx="425" cy="471" r="3" fill="#FFFFFF" />
  <!-- Layer 3: Long Drop Chain with Coin / Medallion -->
  <path d="M160,120 C200,440 280,560 400,580 C520,560 600,440 640,120" fill="none" stroke="url(#gold)" stroke-width="5" />
  <g transform="translate(400, 580)">
