    <circle cx="0" cy="65" r="28" fill="url(#gold)" stroke="#8A6014" stroke-width="2" />
    <circle cx="0" cy="65" r="22" fill="none" stroke="#FAF2D8" stroke-width="1.5" />
    <!-- Sunburst in medallion -->
    <polygon points="0,50 3,62 15,65 3,68 0,80 -3,68 -15,65 -3,62" fill="#FFFFFF" />
  </g>
  <text x="400" y="740" text-anchor="middle" font-family="'Playfair Display', serif" font-size="14" letter-spacing="6" fill="#B08D57" opacity="0.85">ROYRA JEWELS • LAYERED GOLD CASCADE</text>
