<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FCFAF7" />
      <stop offset="70%" stop-color="#F2ECE2" />
      <stop offset="100%" stop-color="#E2D7BF" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FDF1D6" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E6F4FA" />
      <stop offset="80%" stop-color="#CCE5F3" />
      <stop offset="100%" stop-color="#9BC7E2" />
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bgGrad)" />
  <circle cx="400" cy="400" r="320" fill="none" stroke="#EFE9DC" stroke-width="1.5" />
  <!-- Pair of Diamond Studs -->
  <g transform="translate(280, 400)">
    <circle cx="0" cy="0" r="75" fill="url(#gold)" />
    <!-- Prongs -->
    <circle cx="0" cy="-68" r="8" fill="url(#gold)" />
    <circle cx="68" cy="0" r="8" fill="url(#gold)" />
    <circle cx="0" cy="68" r="8" fill="url(#gold)" />
    <circle cx="-68" cy="0" r="8" fill="url(#gold)" />
    <!-- Diamond Gem -->
    <polygon points="0,-60 42,-42 60,0 42,42 0,60 -42,42 -60,0 -42,-42" fill="url(#diamondGrad)" stroke="#FFFFFF" stroke-width="2" />
    <polygon points="0,-30 30,0 0,30 -30,0" fill="#FFFFFF" opacity="0.8" />
    <polygon points="0,-60 20,-20 0,-30 -20,-20" fill="#EFF6FB" />
    <polygon points="60,0 20,20 30,0 20,-20" fill="#A8D2EB" />
  </g>
  <g transform="translate(520, 400)">
    <circle cx="0" cy="0" r="75" fill="url(#gold)" />
    <circle cx="0" cy="-68" r="8" fill="url(#gold)" />
    <circle cx="68" cy="0" r="8" fill="url(#gold)" />
    <circle cx="0" cy="68" r="8" fill="url(#gold)" />
    <circle cx="-68" cy="0" r="8" fill="url(#gold)" />
    <polygon points="0,-60 42,-42 60,0 42,42 0,60 -42,42 -60,0 -42,-42" fill="url(#diamondGrad)" stroke="#FFFFFF" stroke-width="2" />
    <polygon points="0,-30 30,0 0,30 -30,0" fill="#FFFFFF" opacity="0.8" />
    <polygon points="0,-60 20,-20 0,-30 -20,-20" fill="#EFF6FB" />
    <polygon points="60,0 20,20 30,0 20,-20" fill="#A8D2EB" />
  </g>
  <text x="400" y="740" text-anchor="middle" font-family="'Playfair Display', serif" font-size="14" letter-spacing="6" fill="#B08D57" opacity="0.85">ROYRA JEWELS • SOLITAIRE STUDS</text>
</svg>
