<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FCFAF7" />
      <stop offset="70%" stop-color="#F3ECE2" />
      <stop offset="100%" stop-color="#E2D8BE" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF1D6" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#996515" />
      <stop offset="100%" stop-color="#E5C158" />
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bgGrad)" />
  <circle cx="400" cy="400" r="320" fill="none" stroke="#EFE9DC" stroke-width="1.5" />
  <!-- Minimal Sleek Gold Bangle Stack -->
  <g transform="translate(400, 420)">
    <ellipse cx="0" cy="-40" rx="230" ry="120" fill="none" stroke="url(#gold)" stroke-width="24" />
    <ellipse cx="0" cy="0" rx="230" ry="120" fill="none" stroke="url(#gold)" stroke-width="18" opacity="0.9" />
    <ellipse cx="0" cy="40" rx="230" ry="120" fill="none" stroke="url(#gold)" stroke-width="20" opacity="0.8" />
    <!-- Accents on top bangle -->
    <rect x="-30" y="70" width="60" height="20" rx="6" fill="#FFFFFF" stroke="url(#gold)" stroke-width="3" />
    <circle cx="-15" cy="80" r="4" fill="#60A5FA" />
    <circle cx="0" cy="80" r="4" fill="#60A5FA" />
    <circle cx="15" cy="80" r="4" fill="#60A5FA" />
  </g>
  <text x="400" y="740" text-anchor="middle" font-family="'Playfair Display', serif" font-size="14" letter-spacing="6" fill="#B08D57" opacity="0.85">ROYRA JEWELS • MINIMAL GOLD BANGLES</text>
</svg>
