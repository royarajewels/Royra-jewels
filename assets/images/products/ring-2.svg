<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FCFAF7" />
      <stop offset="70%" stop-color="#F3ECE1" />
      <stop offset="100%" stop-color="#E5DCBF" />
    </radialGradient>
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE4D6" />
      <stop offset="30%" stop-color="#E8A598" />
      <stop offset="60%" stop-color="#C77D70" />
      <stop offset="90%" stop-color="#F2C2B8" />
      <stop offset="100%" stop-color="#9C5245" />
    </linearGradient>
    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bgGrad)" />
  <circle cx="400" cy="400" r="320" fill="none" stroke="#EFE9DC" stroke-width="1.5" />
  <ellipse cx="400" cy="580" rx="180" ry="22" fill="#3D311A" opacity="0.1" />
  <!-- Ring Shank -->
  <ellipse cx="400" cy="460" rx="150" ry="130" fill="none" stroke="url(#roseGold)" stroke-width="26" />
  <g transform="translate(400, 270)">
    <!-- Halo Cluster -->
    <circle cx="0" cy="0" r="80" fill="none" stroke="url(#roseGold)" stroke-width="10" />
    <!-- Outer halo micro diamonds -->
    <g fill="url(#diamondGrad)" stroke="#FFFFFF" stroke-width="1">
      <circle cx="0" cy="-75" r="14" />
      <circle cx="53" cy="-53" r="14" />
      <circle cx="75" cy="0" r="14" />
      <circle cx="53" cy="53" r="14" />
      <circle cx="0" cy="75" r="14" />
      <circle cx="-53" cy="53" r="14" />
      <circle cx="-75" cy="0" r="14" />
      <circle cx="-53" cy="-53" r="14" />
    </g>
    <!-- Center Cushion Diamond -->
    <rect x="-42" y="-42" width="84" height="84" rx="16" fill="url(#diamondGrad)" stroke="#FFFFFF" stroke-width="2" />
    <polygon points="0,-40 40,0 0,40 -40,0" fill="#FFFFFF" opacity="0.75" />
    <polygon points="0,-20 20,0 0,20 -20,0" fill="#BAE6FD" opacity="0.6" />
    <!-- Center sparkle -->
    <polygon points="0,-12 4,-3 12,0 4,3 0,12 -4,3 -12,0 -4,-3" fill="#FFFFFF" />
  </g>
  <text x="400" y="740" text-anchor="middle" font-family="'Playfair Display', serif" font-size="14" letter-spacing="6" fill="#B08D57" opacity="0.85">ROYRA JEWELS • DIAMOND HALO</text>
</svg>
