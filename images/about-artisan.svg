<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="100%" height="100%">
  <defs>
    <radialGradient id="aboutGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#FCFAF7" />
      <stop offset="50%" stop-color="#F3EDE2" />
      <stop offset="100%" stop-color="#E2D4BD" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF1D6" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
  </defs>
  <rect width="800" height="900" fill="url(#aboutGrad)" />
  <circle cx="400" cy="420" r="320" fill="none" stroke="#E3D7C1" stroke-width="2" />
  <circle cx="400" cy="420" r="260" fill="none" stroke="#D4AF37" stroke-width="1" stroke-dasharray="6,6" />
  <!-- Atelier Handcraft Graphic -->
  <g transform="translate(400, 420)">
    <ellipse cx="0" cy="80" rx="180" ry="120" fill="none" stroke="url(#gold)" stroke-width="22" />
    <circle cx="0" cy="-60" r="50" fill="none" stroke="url(#gold)" stroke-width="8" />
    <polygon points="0,-120 40,-70 0,-20 -40,-70" fill="#FFFFFF" stroke="url(#gold)" stroke-width="2" />
    <polygon points="0,-120 0,-20 40,-70" fill="#BAE6FD" opacity="0.6" />
    <!-- Workbench silhouette lines -->
    <line x1="-180" y1="200" x2="180" y2="200" stroke="#B08D57" stroke-width="3" />
    <text x="0" y="240" text-anchor="middle" font-family="'Playfair Display', serif" font-size="16" letter-spacing="6" fill="#8A631B">THE ROYRA ATELIER</text>
  </g>
</svg>
